[package]
name = "kubernetes-export"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
k8s-openapi = { version = "0.29.0", features = ["v1_36"] }
kube = { version = "5.0.0", features = ["client", "rustls-tls", "ring"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
